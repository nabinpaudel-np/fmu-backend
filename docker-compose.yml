services:
  postgres:
    image: postgres:17-alpine
    container_name: fmu-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - fmu-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: fmu-app
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      APP_ENV: development
      PORT: 8080

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      # Explicit override — main.go uses DATABASE_URL when set, ignoring DB_*
      # above. Must point at the docker service, not localhost, otherwise the
      # container connects to itself and fails.
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      ACCESS_TOKEN_EXPIRY: 60m
      REFRESH_TOKEN_EXPIRY: 168h
      PASSWORD_RESET_EXPIRY: ${PASSWORD_RESET_EXPIRY:-1h}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}

      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      FRONTEND_URL: ${FRONTEND_URL}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-fmu}
      CLOUDINARY_SECURE_DELIVERY: ${CLOUDINARY_SECURE_DELIVERY:-true}

      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_DOCS_BUCKET: ${SUPABASE_DOCS_BUCKET:-documents}

      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-false}

    volumes:
      # Source bind-mount — edits on the host are seen by Air inside the container
      - .:/app
      # Caches survive `docker compose down` so rebuilds stay fast
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
      # Air's build output (isolated from any host ./tmp)
      - air_tmp:/app/tmp

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - fmu-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fmu-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - fmu-network

networks:
  fmu-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  go_mod_cache:
  go_build_cache:
  air_tmp:
